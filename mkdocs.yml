site_name: Cybernetics 2077 Wiki
site_description: Player guides, cyberware stats, quickhacks and village services for the Minecraft mod.
site_url: https://bithio999.github.io/Cybernetics-2077/
docs_dir: docs/wiki
site_dir: site
strict: true
hooks:
  - docs/site_hooks.py
theme:
  name: material
  language: en
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    scheme: slate
    primary: black
    accent: cyan
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
plugins:
  - search:
      lang: en
markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
extra_css:
  - assets/stylesheets/wiki.css
extra:
  generator: false
nav:
  - Home: index.md
  - Start here:
      - Getting started: getting-started.md
      - Installing cyberware: installation.md
      - Controls: controls.md
      - Common questions: faq.md
  - Cyberware:
      - All cyberware: cyberware.md
