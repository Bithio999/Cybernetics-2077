name: Test Media Workshop
on:
  push:
    paths: ['tools/media-workshop/**', '.github/workflows/media-workshop.yml']
  pull_request:
    paths: ['tools/media-workshop/**', '.github/workflows/media-workshop.yml']
  workflow_dispatch:
jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/media-workshop/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r tools/media-workshop/requirements.txt
      - run: python -m unittest discover -s tools/media-workshop/tests -v
