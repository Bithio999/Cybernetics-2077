gradle.projectsEvaluated {
 rootProject.sourceSets.main.java.srcDir(rootProject.file('docs/review'))
 rootProject.sourceSets.main.resources.setSrcDirs([rootProject.file('docs/review/resources'),rootProject.file('src/main/resources')])
 rootProject.tasks.named('processResources').configure { duplicatesStrategy=DuplicatesStrategy.EXCLUDE }
 def reviewRoot=rootProject.findProperty('cyberReviewRoot') ?: '/tmp/cybernetics2077-review'
 rootProject.neoForge.runs.client.gameDirectory=rootProject.file(reviewRoot+'/client')
 rootProject.neoForge.runs.client.systemProperty('cybernetics2077.reviewRoot',reviewRoot.toString())
 if(rootProject.hasProperty('hacksReview')) rootProject.neoForge.runs.client.systemProperty('cybernetics2077.hacksReview','true')
 if(rootProject.hasProperty('stockReview')) rootProject.neoForge.runs.client.systemProperty('cybernetics2077.stockReview','true')
 if(rootProject.hasProperty('contractReview')) rootProject.neoForge.runs.client.systemProperty('cybernetics2077.contractReview','true')
 if(rootProject.hasProperty('cityReview')) rootProject.neoForge.runs.client.systemProperty('cybernetics2077.cityReview','true')
 if(rootProject.hasProperty('cyberContentOnly')) rootProject.neoForge.runs.client.systemProperty('cybernetics2077.contentOnly','true')
 if(rootProject.hasProperty('cyberRecording')) rootProject.neoForge.runs.client.systemProperty('cybernetics2077.recording','true')
 def recording=rootProject.hasProperty('cyberRecording')
 rootProject.neoForge.runs.client.programArguments.addAll('--quickPlaySingleplayer','Cybernetics Review','--width',recording?'960':'1280','--height',recording?'540':'720')
}
