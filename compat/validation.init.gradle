// Optional test fixtures and local TaCZ JARs; never applied by release builds.
gradle.projectsEvaluated {
    def p = rootProject
    def forge = p.plugins.hasPlugin('net.neoforged.moddev.legacyforge')
    def ext = forge ? p.legacyForge : p.neoForge
    def prefix = forge ? '../' : ''
    if (p.hasProperty('compatFullExpansionReview')) ext.runs.client.systemProperty('cybernetics2077.fullExpansionReview','true')
    if (p.hasProperty('compatCreativeReview')) ext.runs.client.systemProperty('cybernetics2077.creativeReview','true')
    if (p.hasProperty('compatTemporalGunReview')) ext.runs.client.systemProperty('cybernetics2077.temporalGunReview','true')
    if (p.hasProperty('compatRicochetReview')) ext.runs.client.systemProperty('cybernetics2077.ricochetReview','true')
    if (p.hasProperty('compatHandsServiceReview')) ext.runs.client.systemProperty('cybernetics2077.handsServiceReview','true')
    if (p.hasProperty('compatBountyReview')) ext.runs.client.systemProperty('cybernetics2077.bountyReview','true')
    if (p.hasProperty('compatDavidReview')) ext.runs.client.systemProperty('cybernetics2077.davidReview','true')
    if (p.hasProperty('compatGunReview')) ext.runs.client.systemProperty('cybernetics2077.gunReview','true')
    if (p.hasProperty('compatClientReview')) {
        p.sourceSets.main.java.srcDir(p.file(prefix + 'compat/' + (forge ? 'forge' : 'neo') + '-clientreview'))
        ext.runs.client.systemProperty('cybernetics2077.compatOutput', p.findProperty('compatOutput') ?: p.file('build/compat-client-review').absolutePath)
    }
    if (p.hasProperty('compatGameTests') && !forge) {
        p.sourceSets.main.java.srcDir(p.file('compat/gametest'))
        p.sourceSets.main.resources.srcDir(p.file('docs/review/resources'))
    }
    def jars = ['taczJar', 'jeiJar', 'taczTweaksJar', 'kotlinJar', 'yaclJar'].findAll { p.findProperty(it) }.collect { p.file(p.findProperty(it)) }
    if (forge && !jars.isEmpty()) {
        p.repositories.exclusiveContent {
            forRepository { p.repositories.flatDir { dirs jars.collect { it.parentFile }.unique() } }
            filter { includeGroup 'compat.local' }
        }
    }
    jars.each { jar ->
        if (forge) p.dependencies.add('modRuntimeOnly', [group: 'compat.local', name: jar.name.replaceFirst(/\.jar$/, ''), version: 'pinned'])
        else p.dependencies.add('runtimeOnly', p.files(jar))
    }
    if (p.findProperty('compatRunDir')) {
        ext.runs.server.gameDirectory = p.file(p.findProperty('compatRunDir'))
        ext.runs.client.gameDirectory = p.file(p.findProperty('compatRunDir'))
    }
}
